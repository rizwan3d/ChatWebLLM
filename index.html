<!doctype html>
<html lang="en" class="h-full bg-white dark:bg-zinc-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>ChatWebLLM</title>
  <script>tailwind={config:{darkMode:'class'}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *{scrollbar-width:thin;scrollbar-color:#71717a55 transparent}.msg pre{overflow:auto;border:1px solid #71717a44;border-radius:12px;padding:12px;background:#18181b;color:#f4f4f5}.msg code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.typing:after{content:'▍';animation:b .8s infinite}@keyframes b{50%{opacity:0}}@media(max-width:767px){#sidebar{transform:translateX(-102%)}#sidebar.open{transform:none}}
  </style>
</head>
<body class="h-full overflow-hidden bg-white text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100">
<div class="flex h-full">
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col border-r border-zinc-200 bg-zinc-50 p-3 transition dark:border-zinc-800 dark:bg-zinc-900 md:static md:translate-x-0">
    <div class="flex h-11 items-center justify-between px-2"><div><b class="text-sm">ChatWebLLM</b><div class="text-[11px] text-zinc-500">Local-first chat</div></div><button id="closeSidebar" class="md:hidden">✕</button></div>
    <button id="newChat" class="mt-2 rounded-xl px-3 py-2 text-left text-sm hover:bg-zinc-200 dark:hover:bg-zinc-800">＋ New chat</button>
    <div class="mt-4 px-3 text-[11px] text-zinc-500">Chats</div>
    <div id="chatList" class="mt-1 min-h-0 flex-1 overflow-y-auto"></div>
    <button id="openSettings" class="mt-2 rounded-xl px-3 py-2 text-left text-sm hover:bg-zinc-200 dark:hover:bg-zinc-800">⚙ Settings</button>
    <div class="px-3 py-2 text-[11px] text-zinc-500"><span id="statusDot">●</span> <span id="statusText">Not connected</span></div>
  </aside>

  <main class="relative flex min-w-0 flex-1 flex-col">
    <header class="flex h-14 items-center justify-between border-b border-zinc-200 px-3 dark:border-zinc-800">
      <div class="flex min-w-0 items-center gap-2"><button id="openSidebar" class="md:hidden">☰</button><button id="modelButton" class="min-w-0 rounded-xl px-3 py-1.5 text-left hover:bg-zinc-100 dark:hover:bg-zinc-900"><div id="modelLabel" class="truncate text-sm font-semibold">No model selected</div><div id="chatTitle" class="truncate text-[11px] text-zinc-500">New conversation</div></button></div>
      <button id="clearChat" class="rounded-xl px-3 py-2 text-sm text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-900">Clear</button>
    </header>

    <section id="chatArea" class="min-h-0 flex-1 overflow-y-auto">
      <div id="welcome" class="mx-auto grid min-h-full max-w-3xl place-content-center px-6 pb-32 text-center"><div class="mx-auto grid size-12 place-items-center rounded-2xl border border-zinc-200 dark:border-zinc-800">✦</div><h1 class="mt-5 text-3xl font-semibold tracking-tight">How can I help?</h1><p class="mt-2 text-sm text-zinc-500">Chat with an LLM running on your own computer.</p></div>
      <div id="messages" class="mx-auto hidden w-full max-w-3xl space-y-7 px-4 pb-40 pt-7 sm:px-6"></div>
    </section>

    <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-white via-white/95 to-transparent px-3 pb-4 pt-12 dark:from-zinc-950 dark:via-zinc-950/95">
      <div class="mx-auto max-w-3xl">
        <div id="attachments" class="mb-2 flex flex-wrap gap-2"></div>
        <div class="rounded-2xl border border-zinc-200 bg-white p-2 shadow-lg dark:border-zinc-800 dark:bg-zinc-900">
          <textarea id="prompt" rows="1" placeholder="Message your local model…" class="max-h-44 min-h-11 w-full resize-none bg-transparent px-2 py-2 text-sm outline-none"></textarea>
          <div class="flex items-center justify-between"><div class="flex gap-1"><label class="cursor-pointer rounded-xl px-3 py-2 text-xs text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-800">＋ File<input id="fileInput" type="file" multiple class="hidden"></label><span id="toolCount" class="rounded-xl px-2 py-2 text-[11px] text-zinc-500"></span></div><button id="send" class="rounded-xl bg-zinc-900 px-4 py-2 text-xs font-medium text-white disabled:opacity-40 dark:bg-white dark:text-zinc-900">Send</button></div>
        </div>
        <div class="mt-2 text-center text-[10px] text-zinc-500">Requests go directly from this browser to your local LLM endpoint.</div>
      </div>
    </div>
  </main>
</div>

<div id="settings" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-3">
  <div class="flex max-h-[90vh] w-full max-w-2xl flex-col overflow-hidden rounded-2xl border border-zinc-200 bg-white shadow-2xl dark:border-zinc-800 dark:bg-zinc-900">
    <div class="flex items-center justify-between border-b border-zinc-200 px-5 py-4 dark:border-zinc-800"><b>Settings</b><button id="closeSettings">✕</button></div>
    <div class="overflow-y-auto p-5">
      <div class="grid gap-5">
        <section><h2 class="mb-3 text-xs font-semibold uppercase tracking-wide text-zinc-500">Connection</h2><div class="grid gap-3 sm:grid-cols-2"><label class="text-xs">Provider<select id="provider" class="mt-1 h-10 w-full rounded-xl border border-zinc-300 bg-transparent px-3 dark:border-zinc-700"><option value="ollama">Ollama</option><option value="openai">OpenAI-compatible</option></select></label><label class="text-xs">Base URL<input id="baseUrl" class="mt-1 h-10 w-full rounded-xl border border-zinc-300 bg-transparent px-3 dark:border-zinc-700"></label><label class="text-xs">Model<input id="model" class="mt-1 h-10 w-full rounded-xl border border-zinc-300 bg-transparent px-3 dark:border-zinc-700"></label><label class="text-xs">API key<input id="apiKey" type="password" class="mt-1 h-10 w-full rounded-xl border border-zinc-300 bg-transparent px-3 dark:border-zinc-700"></label></div><div class="mt-3 flex gap-2"><button id="loadModels" class="rounded-xl border border-zinc-300 px-3 py-2 text-xs dark:border-zinc-700">Load models</button><button id="testConnection" class="rounded-xl border border-zinc-300 px-3 py-2 text-xs dark:border-zinc-700">Test</button><span id="testResult" class="self-center text-xs text-zinc-500"></span></div><div id="modelChoices" class="mt-2 flex flex-wrap gap-2"></div></section>

        <section><h2 class="mb-3 text-xs font-semibold uppercase tracking-wide text-zinc-500">Generation</h2><div class="grid gap-3 sm:grid-cols-3"><label class="text-xs">Temperature<input id="temperature" type="number" min="0" max="2" step=".1" class="mt-1 h-10 w-full rounded-xl border border-zinc-300 bg-transparent px-3 dark:border-zinc-700"></label><label class="text-xs">Max tokens<input id="maxTokens" type="number" min="1" class="mt-1 h-10 w-full rounded-xl border border-zinc-300 bg-transparent px-3 dark:border-zinc-700"></label><label class="text-xs">Reasoning<select id="reasoning" class="mt-1 h-10 w-full rounded-xl border border-zinc-300 bg-transparent px-3 dark:border-zinc-700"><option value="off">Off</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></label></div><label class="mt-3 block text-xs">System message<textarea id="systemPrompt" rows="5" class="mt-1 w-full rounded-xl border border-zinc-300 bg-transparent p-3 dark:border-zinc-700"></textarea></label></section>

        <section><h2 class="mb-3 text-xs font-semibold uppercase tracking-wide text-zinc-500">Tools</h2><div class="space-y-2 text-sm"><label class="flex justify-between rounded-xl border border-zinc-200 p-3 dark:border-zinc-800"><span>Enable tool calling</span><input id="toolsEnabled" type="checkbox"></label><label class="flex justify-between rounded-xl border border-zinc-200 p-3 dark:border-zinc-800"><span>Calculator</span><input id="calculatorTool" type="checkbox"></label><label class="flex justify-between rounded-xl border border-zinc-200 p-3 dark:border-zinc-800"><span>Current time</span><input id="timeTool" type="checkbox"></label><label class="flex justify-between rounded-xl border border-zinc-200 p-3 dark:border-zinc-800"><span><b class="block text-sm">JavaScript sandbox</b><small class="text-zinc-500">run_javascript in sandboxed iframe + Worker</small></span><input id="jsTool" type="checkbox"></label><label class="flex justify-between rounded-xl border border-zinc-200 p-3 dark:border-zinc-800"><span><b class="block text-sm">Symbolic math (Nerdamer)</b><small class="text-zinc-500">Requires JavaScript sandbox</small></span><input id="nerdamerTool" type="checkbox"></label><label class="block rounded-xl border border-zinc-200 p-3 text-xs dark:border-zinc-800">Sandbox timeout (ms)<input id="jsTimeout" type="number" min="250" max="10000" step="250" class="mt-1 h-9 w-full rounded-lg border border-zinc-300 bg-transparent px-3 dark:border-zinc-700"></label></div></section>

        <section><h2 class="mb-3 text-xs font-semibold uppercase tracking-wide text-zinc-500">Appearance</h2><select id="theme" class="h-10 w-full rounded-xl border border-zinc-300 bg-transparent px-3 text-sm dark:border-zinc-700"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select></section>
      </div>
    </div>
    <div class="flex justify-end border-t border-zinc-200 p-4 dark:border-zinc-800"><button id="saveSettings" class="rounded-xl bg-zinc-900 px-4 py-2 text-xs font-medium text-white dark:bg-white dark:text-zinc-900">Save settings</button></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
